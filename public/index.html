<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Quantum HUD - Vision Pro</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            margin: 0;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #161b22;
            padding: 10px 15px;
            border-radius: 12px;
            box-sizing: border-box;
            margin-bottom: 15px;
            border: 1px solid #30363d;
        }
        .status-badge {
            color: #3fb950;
            font-size: 12px;
            font-weight: bold;
        }
        .hud-card {
            width: 100%;
            max-width: 400px;
            background: #161b22;
            border: 2px solid #ff3b3b;
            border-radius: 16px;
            padding: 20px;
            text-align: center;
            box-sizing: border-box;
            box-shadow: 0 0 20px rgba(255, 59, 59, 0.3);
            margin-bottom: 15px;
        }
        .signal-title {
            font-size: 12px;
            color: #8b949e;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .signal-value {
            font-size: 28px;
            font-weight: bold;
            color: #ff3b3b;
            margin-bottom: 10px;
        }
        .signal-value.call {
            color: #3fb950;
            text-shadow: 0 0 10px rgba(63, 185, 80, 0.4);
        }
        /* สไตล์ปุ่ม Vision AI */
        .vision-btn {
            width: 100%;
            max-width: 400px;
            background: linear-gradient(135deg, #238636, #2ea043);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
            box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
            transition: 0.2s;
        }
        .vision-btn:active {
            transform: scale(0.98);
        }
        #fileInput {
            display: none;
        }
        .stats-container {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-around;
            background: #161b22;
            padding: 15px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-sizing: border-box;
            margin-bottom: 15px;
        }
        .stat-box text {
            display: block;
        }
        .log-box {
            width: 100%;
            max-width: 400px;
            background: #161b22;
            padding: 12px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-sizing: border-box;
            font-size: 12px;
            color: #8b949e;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="status-badge">🟢 VISION HUD ACTIVE</div>
        <div style="font-size: 13px; font-weight: bold;">EUR/USD (Live)</div>
    </div>

    <!-- ปุ่มกดสแกนภาพกราฟหน้าจอ -->
    <input type="file" id="fileInput" accept="image/*" onchange="uploadAndAnalyze(event)">
    <button class="vision-btn" onclick="document.getElementById('fileInput').click()">
        📸 สแกนภาพกราฟด้วย AI Vision
    </button>

    <div class="hud-card" id="hudCard">
        <div class="signal-title">LIVE VISION ORDER SIGNAL ENGINE</div>
        <div class="signal-value" id="signalText">รอสแกนภาพกราฟ...</div>
        <div style="font-size: 12px; color: #c9d1d9;" id="visionMsg">กดปุ่มด้านบนเพื่ออัปโหลดภาพหน้าจอ 8x Trade</div>
    </div>

    <div class="stats-container">
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #8b949e;">วิเคราะห์ถูก (WIN)</div>
            <div style="font-size: 18px; color: #3fb950; font-weight: bold;" id="winCount">33 ไม้</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #8b949e;">วิเคราะห์ผิด (LOSS)</div>
            <div style="font-size: 18px; color: #ff3b3b; font-weight: bold;" id="lossCount">7 ไม้</div>
        </div>
        <div style="text-align: center;">
            <div style="font-size: 11px; color: #8b949e;">WIN RATE</div>
            <div style="font-size: 18px; color: #f0883e; font-weight: bold;" id="winRate">82.5%</div>
        </div>
    </div>

    <div class="log-box">
        <div style="margin-bottom: 5px; font-weight: bold; color: #c9d1d9;">📋 VISION ANALYSIS LOG</div>
        <div id="logText">ระบบพร้อมใช้งาน รองรับการตรวจจับภาพหน้าจอเรียลไทม์</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // ฟังก์ชันส่งภาพไปยังเซิร์ฟเวอร์เพื่อให้ AI Vision วิเคราะห์
        function uploadAndAnalyze(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onloadfile = function() {}
            reader.onload = async function(e) {
                const base64Image = e.target.result;

                document.getElementById('signalText').innerText = "AI กำลังวิเคราะห์ภาพ...";
                document.getElementById('visionMsg').innerText = "โปรดรอสักครู่ สมองกลกำลังประมวลผลแท่งเทียน...";

                try {
                    const response = await fetch('/api/analyze-vision', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ image: base64Image })
                    });
                    const data = await response.json();

                    if (data.success) {
                        const sigElem = document.getElementById('signalText');
                        sigElem.innerText = `${data.signal} SIGNAL`;
                        if (data.signal === 'CALL') {
                            sigElem.className = "signal-value call";
                            document.getElementById('hudCard').style.borderColor = "#3fb950";
                            document.getElementById('hudCard').style.boxShadow = "0 0 20px rgba(63, 185, 80, 0.3)";
                        } else {
                            sigElem.className = "signal-value";
                            document.getElementById('hudCard').style.borderColor = "#ff3b3b";
                            document.getElementById('hudCard').style.boxShadow = "0 0 20px rgba(255, 59, 59, 0.3)";
                        }

                        document.getElementById('visionMsg').innerText = `ความมั่นใจ: ${data.confidence}%`;
                        document.getElementById('logText').innerText = `${new Date().toLocaleTimeString()} - ${data.message}`;
                    } else {
                        alert("เกิดข้อผิดพลาดในการวิเคราะห์");
                    }
                } catch (err) {
                    alert("ไม่สามารถเชื่อมต่อกับเซิร์ฟเวอร์วิเคราะห์ได้");
                }
            };
            reader.readAsDataURL(file);
        }

        // ดึงค่าสถิติอัปเดตต่อเนื่อง
        async function fetchStats() {
            try {
                const res = await fetch('/api/stats');
                const data = await res.json();
                if(data.success) {
                    const stats = data.stats.EURUSD;
                    document.getElementById('winCount').innerText = `${stats.wins} ไม้`;
                    document.getElementById('lossCount').innerText = `${stats.losses} ไม้`;
                    document.getElementById('winRate').innerText = `${stats.winRate}%`;
                }
            } catch(e) {}
        }
        setInterval(fetchStats, 3000);
    </script>
</body>
</html>
