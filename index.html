<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Smart Signal Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            background-color: #0f172a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            margin-top: 20px;
        }
        h2 { color: #38bdf8; margin-bottom: 10px; }
        .card {
            background: #334155;
            padding: 15px;
            border-radius: 8px;
            margin: 15px 0;
            text-align: left;
        }
        .status { color: #4ade80; font-weight: bold; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🤖 AI Smart Signal</h2>
        <p>สถานะระบบ: <span class="status">● กำลังทำงาน 24/7</span></p>
        
        <div class="card">
            <h3>📊 สถิติคู่เงิน EUR/USD</h3>
            <p>ชนะ (Wins): <span id="wins">0</span></p>
            <p>แพ้ (Losses): <span id="losses">0</span></p>
            <p>AI Bias: <span id="bias">0.00012</span></p>
        </div>
    </div>

    <script>
        // เชื่อมต่อ Telegram Web App
        let tg = window.Telegram.WebApp;
        tg.expand();

        // ดึงข้อมูลสถิติจากหลังบ้านมาแสดงผล
        fetch('/api/stats')
            .then(res => res.json())
            .then(data => {
                if(data.success && data.stats.EURUSD) {
                    document.getElementById('wins').innerText = data.stats.EURUSD.wins;
                    document.getElementById('losses').innerText = data.stats.EURUSD.losses;
                    document.getElementById('bias').innerText = data.stats.EURUSD.bias.toFixed(5);
                }
            }).catch(err => console.log(err));
    </script>
</body>
</html>
