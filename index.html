<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Trading Mini App</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #1c1c1e;
      color: #ffffff;
      margin: 0;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 90vh;
      text-align: center;
    }
    .card {
      background: #2c2c2e;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.3);
      width: 100%;
      max-width: 360px;
      box-sizing: border-box;
    }
    .status {
      display: inline-block;
      padding: 6px 12px;
      background: rgba(52, 199, 89, 0.2);
      color: #34c759;
      border-radius: 20px;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 22px;
      margin: 0 0 10px 0;
    }
    p {
      color: #aeaeb2;
      font-size: 14px;
      line-height: 1.5;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="status">🟢 AI SCANNER ACTIVE</div>
    <h1>AI Trading Dashboard</h1>
    <p>ระบบสแกนวิเคราะห์กราฟด้วย AI กำลังทำงานอัตโนมัติ 24/7</p>
    <p>เมื่อพบสัญญาณความแม่นยำสูง ระบบจะส่งแจ้งเตือนเข้าห้องแชท Telegram ทันทีครับ</p>
  </div>

  <script>
    // แจ้ง Telegram ให้ปรับขนาดหน้าจอ Mini App
    if (window.Telegram && window.Telegram.WebApp) {
      window.Telegram.WebApp.ready();
      window.Telegram.WebApp.expand();
    }
  </script>
</body>
</html>
